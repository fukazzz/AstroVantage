name: Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLANG_PATH: ${{ github.workspace }}/clang
      GCC64_PATH: ${{ github.workspace }}/gcc64
      GCC32_PATH: ${{ github.workspace }}/gcc32
      OC_OUT: ${{ github.workspace }}/out
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set Timezone & Build Time
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          echo "time=$(TZ=Asia/Jakarta date '+%d%m%y')" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
            bc cpio flex bison git tar perl wget curl aria2 lz4 lzop \
            build-essential device-tree-compiler libssl-dev libncurses-dev \
            libelf-dev zlib1g-dev python-is-python3 \
            gcc-multilib g++-multilib zip unzip rsync ccache

      - name: Cache Toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CLANG_PATH }}
            ${{ env.GCC64_PATH }}
            ${{ env.GCC32_PATH }}
          key: gcc-clang-r547379

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ github.ref_name }}-
            kernel-ccache-

      - name: Clone Toolchains
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${CLANG_PATH}" "${GCC64_PATH}" "${GCC32_PATH}"
          aria2c -x16 -s16 -k1M -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/69c39c2ca6a2ab22eedc95f903a1e53c386a4e8c/clang-r547379.tar.gz"
          tar -C "${CLANG_PATH}" -xzf clang.tar.gz && rm -f clang.tar.gz
          git clone --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git -b android12L-release "${GCC64_PATH}"
          git clone --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git -b android12L-release "${GCC32_PATH}"

      - name: Setup KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/fukazzz/KernelSU-Next/refs/heads/legacy-susfs/kernel/setup.sh" | bash -s legacy-susfs

      - name: Build Kernel
        run: |
          export PATH="${CLANG_PATH}/bin:${GCC64_PATH}/bin:${GCC32_PATH}/bin:/usr/lib/ccache:$PATH"
          export KBUILD_BUILD_USER=Craftron
          export KBUILD_BUILD_HOST=ChipZest
          ccache -M 2G
          ccache -z
          make O=$OC_OUT ARCH=arm64 sweet_defconfig
          make -j$(nproc --all) O=$OC_OUT ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            V=0 2>&1 | tee build.log
          ccache -s
          cp $OC_OUT/.config $OC_OUT/sweet_defconfig.txt

      - name: Prepare AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/fukazzz/AnyKernel3 -b main AnyKernel3
          cp $OC_OUT/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f $OC_OUT/arch/arm64/boot/dtb.img ] && cp $OC_OUT/arch/arm64/boot/dtb.img AnyKernel3/
          [ -f $OC_OUT/arch/arm64/boot/dtbo.img ] && cp $OC_OUT/arch/arm64/boot/dtbo.img AnyKernel3/
          rm -rf AnyKernel3/.git AnyKernel3/README.md

      - name: Upload Flashable Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AstroVantage
          path: AnyKernel3/*
          compression-level: 9

      - name: Upload Build Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Assets-${{ env.time }}
          path: |
            build.log
            out/sweet_defconfig.txt
